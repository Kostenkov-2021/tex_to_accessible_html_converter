name: TeX integration

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

jobs:
  convert:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        engine: [latex, lualatex, xelatex]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install TeX Live
        run: ./scripts/install_texlive_ci.ps1
      - name: Check TeX tools
        run: |
          foreach ($tool in @('make4ht', 'latex', 'lualatex', 'xelatex')) {
            $command = Get-Command $tool -CommandType Application -ErrorAction Stop
            Write-Host "$tool`: $($command.Source)"
            & $command.Source --version
            if ($LASTEXITCODE -ne 0) { throw "$tool version check failed." }
          }
      - name: Convert and validate fixtures
        env:
          PYTHONUTF8: '1'
        run: python scripts/check_tex_integration.py --engine '${{ matrix.engine }}'
      - name: Save HTML and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tex-integration-${{ matrix.engine }}
          path: build/tex-integration/${{ matrix.engine }}
          if-no-files-found: warn
          retention-days: 7
