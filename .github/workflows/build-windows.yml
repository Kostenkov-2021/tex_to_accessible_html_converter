name: Build Windows

on:
  pull_request:
    paths:
      - 'tex_to_accessible_html_converter/**'
      - 'packaging/**'
      - 'docs/**'
      - 'LICENSE'
      - 'pytest.ini'
      - '.github/workflows/build-windows.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build and test
        run: ./packaging/build_installer.ps1 -Python (Get-Command python).Source
      - name: Check packaged application
        run: |
          & ./dist/TeXToAccessibleHTML/TeXToAccessibleHTMLCLI.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI failed.' }
          foreach ($path in @(
            'dist/TeXToAccessibleHTML/TeXToAccessibleHTML.exe',
            'dist/TeXToAccessibleHTML/_internal/locales/ru/LC_MESSAGES/tex_to_accessible_html.mo',
            'dist/TeXToAccessibleHTML/docs/README.html',
            'dist/TeXToAccessibleHTML/docs/README_RU.html',
            'dist/TeXToAccessibleHTML/docs/LICENSE'
          )) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing package file: $path" }
          }
      - name: Prepare release assets
        run: |
          Compress-Archive -Path dist/TeXToAccessibleHTML -DestinationPath dist/TeXToAccessibleHTML-portable.zip
          $assets = @(Get-Item dist/TeXToAccessibleHTML-portable.zip) + @(Get-ChildItem dist/installer/*.exe)
          if ($assets.Count -ne 2) { throw 'Expected a portable ZIP and one installer.' }
          New-Item -ItemType Directory -Path dist/release -Force | Out-Null
          $assets | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination dist/release }
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path dist/release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: windows-distribution
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
