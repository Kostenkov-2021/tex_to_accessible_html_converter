name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    defaults:
      run:
        working-directory: tex_to_accessible_html_converter

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tex_to_accessible_html_converter/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Compile translation catalogs
        run: python ../packaging/compile_translations.py

      - name: Run unit tests
        run: python -m pytest -q
