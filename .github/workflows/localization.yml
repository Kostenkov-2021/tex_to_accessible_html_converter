name: Localization

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install polib pytest
      - run: python scripts/check_translations.py
      - run: python packaging/compile_translations.py
      - run: python -m pytest -q tex_to_accessible_html_converter/tests/test_localization.py
