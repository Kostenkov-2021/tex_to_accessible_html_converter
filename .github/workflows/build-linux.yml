name: Build Linux

on:
  pull_request:
    paths:
      - 'tex_to_accessible_html_converter/**'
      - 'packaging/**'
      - 'docs/**'
      - 'LICENSE'
      - 'pytest.ini'
      - '.github/workflows/build-linux.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit to build'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      # Use distro Python and wxGTK together to avoid a wxPython source build.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-wxgtk4.0 libpython3.12 xvfb
          /usr/bin/python3 -m venv --system-site-packages .venv-linux
          .venv-linux/bin/python -m pip install 'pyinstaller>=6.22' 'pytest>=8'
      - name: Build and test
        env:
          PYTHON: .venv-linux/bin/python
        run: bash packaging/build_linux.sh
      - name: Smoke test packaged GUI under X11
        run: bash packaging/smoke_linux_gui.sh dist/linux/TeXToAccessibleHTML/TeXToAccessibleHTML
      - uses: actions/upload-artifact@v7
        with:
          name: linux-distribution
          path: dist/linux/release/*
          if-no-files-found: error
          retention-days: 14
