[project]
name = "tex-to-accessible-html-converter"
version = "0.1.0"
description = "TeX-to-HTML converter with accessible MathML for MathCAT."
requires-python = ">=3.10"
dependencies = ["wxPython>=4.2"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/Kostenkov-2021/tex_to_accessible_html_converter"
Issues = "https://github.com/Kostenkov-2021/tex_to_accessible_html_converter/issues"

[dependency-groups]
dev = [
    "pyinstaller>=6.22",
    "pytest",
]

[tool.pytest.ini_options]
norecursedirs = [".venv", ".git", ".uv-cache", "build", "dist", "conversion_runs"]
